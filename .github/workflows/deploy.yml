name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22


      - run: npm ci
        working-directory: docs-src

      - run: npm run build
        working-directory: docs-src

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-src/dist

      - uses: actions/deploy-pages@v4
